[tool.poetry]
name = "legal-ai-rag"
version = "0.1.0"
description = "Reducing hallucinations in legal AI using retrieval-augmented generation - ingestion, hybrid retrieval, and verified generation pipeline"
authors = ["Legal AI RAG Contributors"]
license = "MIT"
readme = "README.md"
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = { version = "^0.30.0", extras = ["standard"] }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
qdrant-client = "~1.11.0"
langchain-core = "^0.3.0"
langchain-text-splitters = "^0.3.0"
sentence-transformers = "^3.0.1"
numpy = "^1.26.0"
pymupdf = "^1.24.9"
rank-bm25 = "^0.2.2"
Pillow = "^10.4.0"
pytesseract = "^0.3.13"
tenacity = "^8.5.0"
httpx = "^0.27.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
ruff = "^0.6.0"
mypy = "^1.11.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
