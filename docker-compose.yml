services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: legal-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - legal-ai

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ai-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      INGESTION_DIR: /app/data/raw
      EMBEDDING_CACHE_PATH: /app/data/cache/embeddings.db
      DEDUP_STORE_PATH: /app/data/cache/dedup.json
      BM25_LOCAL_PATH: /app/data/cache/bm25.pkl
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      GENERATION_TOP_K: ${GENERATION_TOP_K:-5}
    volumes:
      - ./data/raw:/app/data/raw
      - ./data/cache:/app/data/cache
    ports:
      - "8000:8000"
    depends_on:
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - legal-ai

volumes:
  qdrant_data:

networks:
  legal-ai:
    driver: bridge
