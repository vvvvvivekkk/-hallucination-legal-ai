services:
  qdrant:
    image: qdrant/qdrant:v1.11.5
    container_name: legal-ai-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:6333/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - legal-ai

  postgres:
    image: postgres:16-alpine
    container_name: legal-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: legalai
      POSTGRES_PASSWORD: legalai
      POSTGRES_DB: legalai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalai -d legalai"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - legal-ai

  redis:
    image: redis:7-alpine
    container_name: legal-ai-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - legal-ai

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: legal-ai-api
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://legalai:legalai@postgres:5432/legalai
      REDIS_URL: redis://redis:6379/0
      INGESTION_DIR: /app/data/raw
      AUTO_INGEST_WATCH_DIR: /app/data/raw_documents
      EMBEDDING_CACHE_PATH: /app/data/cache/embeddings.db
      DEDUP_STORE_PATH: /app/data/cache/dedup.json
      BM25_LOCAL_PATH: /app/data/cache/bm25.pkl
      PUBLIC_BASE_URL: http://localhost
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-rotate-this-secret}
      GENERATION_TOP_K: ${GENERATION_TOP_K:-5}
    volumes:
      - ./data:/app/data
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - legal-ai

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: legal-ai-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - legal-ai

volumes:
  qdrant_data:
  postgres_data:
  redis_data:

networks:
  legal-ai:
    driver: bridge
